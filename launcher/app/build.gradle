plugins { id 'com.android.application' }
android {
    namespace 'com.udesh.tvhome'
    compileSdk 34
    defaultConfig {
        applicationId 'com.udesh.tvhome'
        minSdk 31          // the TV runs Android 12 (SDK 31)
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { minifyEnabled false } }
}
dependencies { implementation 'androidx.recyclerview:recyclerview:1.3.2' }
