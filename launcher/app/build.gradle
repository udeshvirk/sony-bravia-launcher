plugins { id 'com.android.application' }
// Secrets live in launcher/local.properties (git-ignored), e.g.  cricket.apiKey=xxxx
def localProps = new Properties()
def lp = rootProject.file('local.properties')
if (lp.exists()) lp.withInputStream { localProps.load(it) }
android {
    namespace 'com.udesh.tvhome'
    compileSdk 34
    defaultConfig {
        applicationId 'com.udesh.tvhome'
        minSdk 31          // the TV runs Android 12 (SDK 31)
        targetSdk 34
        versionCode 1
        versionName '1.0'
        resValue 'string', 'cricket_api_key', localProps.getProperty('cricket.apiKey', '')
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { minifyEnabled false } }
}
dependencies { implementation 'androidx.recyclerview:recyclerview:1.3.2' }
